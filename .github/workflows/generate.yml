name: Generate Design Tokens

on:
  push:
    paths:
      - 'tokens/tokens.json'
      - 'scripts/generate_platforms.py'
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Generate Platforms
        run: python scripts/generate_platforms.py

      - name: Commit Generated Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add platforms/
          git commit -m "chore: auto-generate platform files from tokens" || echo "No changes to commit"
          git push
