name: Generate Design Tokens

on:
  push:
    paths:
      - 'tokens/tokens.json'
      - 'scripts/generate_platforms.py'
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Generate Platforms
        run: python scripts/generate_platforms.py

      - name: Commit Generated Files to Token Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add platforms/
          git commit -m "chore: auto-generate platform files from tokens" || echo "No changes to commit"
          git push

      - name: Push Android Tokens to Android Theme Library
        env:
          # আপনার গিটহাব ইউজারনেম এবং অ্যান্ড্রয়েড রিপোজিটরির নাম এখানে দিন
          # উদাহরণ: xman24477/xnet-hub-theme
          ANDROID_REPO: "xman24477/xnet-hub-theme"
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git clone https://x-access-token:${PAT_TOKEN}@github.com/${ANDROID_REPO}.git android-repo
          cp -r platforms/android/*.xml android-repo/xnet_hub_theme/src/main/res/values/
          cd android-repo
          
          # Get current version from Git tags, or default to 1.0.0
          CURRENT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "1.0.0")
          
          # Split the version string (assumes SemVer format X.Y.Z)
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_TAG"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH="${VERSION_PARTS[2]}"
          
          # Increment patch version
          NEW_PATCH=$((PATCH + 1))
          NEW_TAG="${MAJOR}.${MINOR}.${NEW_PATCH}"
          
          # Update README.md with the new version
          sed -i -E "s/(com\.github\.xman24477:xnet-hub-theme:)[0-9]+\.[0-9]+\.[0-9]+/\1${NEW_TAG}/g" README.md
          sed -i -E "s/(jitpack\.io\/#xman24477\/xnet-hub-theme\/)[0-9]+\.[0-9]+\.[0-9]+/\1${NEW_TAG}/g" README.md
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add xnet_hub_theme/src/main/res/values/ README.md
          
          if git diff --staged --quiet; then
            echo "No changes to commit in android repo"
          else
            git commit -m "chore: auto-update android theme tokens and bump version to ${NEW_TAG}"
            git tag -a "${NEW_TAG}" -m "Release ${NEW_TAG}"
            git push origin main
            git push origin "${NEW_TAG}"
          fi



